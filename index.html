g></div><div><span class="eyebrow">Y SÍ, TAMBIÉN TOMMEN</span><h2>Los chicos de Tommen</h2><p class="saga-author">Chloe Walsh</p><p>Lo del rugby era importante… pero sabemos que no venías solo por eso.</p></div></div><div class="saga-books" style="--shelf-count:6"><a href="#tommen-quotes" data-saga-book="tommen-0" style="--book-tone:#354e55"><small>01</small><strong>Binding 13</strong><span>Chloe Walsh</span></a><a href="#tommen-quotes" data-saga-book="tommen-1" style="--book-tone:#5d6b55"><small>02</small><strong>Keeping 13</strong><span>Chloe Walsh</span></a><a href="#tommen-quotes" data-saga-book="tommen-2" style="--book-tone:#7b5847"><small>03</small><strong>Saving 6</strong><span>Chloe Walsh</span></a><a href="#tommen-quotes" data-saga-book="tommen-3" style="--book-tone:#525a71"><small>04</small><strong>Redeeming 6</strong><span>Chloe Walsh</span></a><a href="#tommen-quotes" data-saga-book="tommen-4" style="--book-tone:#8b7854"><small>05</small><strong>Taming 7</strong><span>Chloe Walsh</span></a><a href="#tommen-quotes" data-saga-book="tommen-5" style="--book-tone:#52645d"><small>06</small><strong>Releasing 10</strong><span>Chloe Walsh</span></a></div><div class="saga-quotes" id="tommen-quotes"><div class="quote-filters" role="group" aria-label="Filtrar citas de Los chicos de Tommen"><button class="selected" data-filter="all" aria-pressed="true">Todos los libros</button><button data-filter="tommen-0" aria-pressed="false">Binding 13</button><button data-filter="tommen-1" aria-pressed="false">Keeping 13</button><button data-filter="tommen-2" aria-pressed="false">Saving 6</button><button data-filter="tommen-3" aria-pressed="false">Redeeming 6</button><button data-filter="tommen-4" aria-pressed="false">Taming 7</button><button data-filter="tommen-5" aria-pressed="false">Releasing 10</button></div><div class="quote-grid"><article class="quote-card tommen-quote" data-book="tommen-0"><span class="eyebrow">Binding 13</span><blockquote>Creo que te necesito para siempre e>Sos lo mejor de mi día…</blockquote><div class="quote-bottom"><p class="quote-credit">Chloe Walsh</p><button class="save-quote" aria-pressed="false" aria-label="Guardar cita 23 como favorita">♡</button></div></article><article class="quote-card tommen-quote" data-book="tommen-2"><span class="eyebrow">Saving 6</span><blockquote>Yo seré tu Wendy.</blockquote><div class="quote-bottom"><p class="quote-credit">Chloe Walsh</p><button class="save-quote" aria-pressed="false" aria-label="Guardar cita 24 como favorita">♡</button></div></article><article class="quote-card tommen-quote" data-book="tommen-2"><span class="eyebrow">Saving 6</span><blockquote>No me odies, Molloy.</blockquote><div class="quote-bottom"><p class="quote-credit">Chloe Walsh</p><button class="save-quote" aria-pressed="false" aria-label="Guardar cita 25 como favorita">♡</button></div></article><article class="quote-card tommen-quote" data-book="tommen-3"><span class="eyebrow">Redeeming 6</span><blockquote>Ey, reina.</blockquote><div class="quote-bottom"><p class="quote-credit">Chloe Walsh</p><button class="save-quote" aria-pressed="false" aria-label="Guardar cita 26 como favorita">♡</button></div></article><article class="quote-card tommen-quote" data-book="tommen-3"><span class="eyebrow">Redeeming 6</span><blockquote>Sos suficiente para mí.</blockquote><div class="quote-bottom"><p class="quote-credit">Chloe Walsh</p><button class="save-quote" aria-pressed="false" aria-label="Guardar cita 27 como favorita">♡</button></div></article><article class="quote-card tommen-quote" data-book="tommen-3"><span class="eyebrow">Redeeming 6</span><blockquote>Porque solo vivo por vos.</blockquote><div class="quote-bottom"><p class="quote-credit">Chloe Walsh</p><button class="save-quote" aria-pressed="false" aria-label="Guardar cita 28 como favorita">♡</button></div></article><article class="quote-card tommen-quote" data-book="tommen-4"><span class="eyebrow">Taming 7</span><blockquote>Sos tan hermosa… brillás incluso en la oscuridad.</blockquote><div class="quote-bottom"><p class="quote-credit">Chloe Walsh</p><button class="save-quote" aria-pressed="false" aria-label="Guardar cita 29 como favorita">♡</button></div></article><article class="quote-card tommen-quote" data-book="tommen-4"><span class="eyebrow">Taming 7</span><blockquote>Ella era mi hábito de toda la vida.</blockquote><div class="quote-bottom"><p class="quote-credit">Chloe Walsh</p><button class="save-quote" aria-pressed="false" aria-label="Guardar cita 30 como favorita">♡</button></div></article><article class="quote-card tommen-quote" data-book="tommen-4"><span class="eyebrow">Taming 7</span><blockquote>Claire era mía.</blockquote><div class="quote-bottom"><p class="quote-credit">Chloe Walsh</p><button class="save-quote" aria-pressed="false" aria-label="Guardar cita 31 como favorita">♡</button></div></article><article class="quote-card tommen-quote" data-book="tommen-5"><span class="eyebrow">Releasing 10</span><blockquote>Voy a estar acá. Siempre.</blockquote><div class="quote-bottom"><p class="quote-credit">Chloe Walsh</p><button class="save-quote" aria-pressed="false" aria-label="Guardar cita 32 como favorita">♡</button></div></article><article class="quote-card tommen-quote" data-book="tommen-5"><span class="eyebrow">Releasing 10</span><blockquote>No me voy, Liz. Me quedo.</blockquote><div class="quote-bottom"><p class="quote-credit">Chloe Walsh</p><button class="save-quote" aria-pressed="false" aria-label="Guardar cita 33 como favorita">♡</button></div></article><article class="quote-card tommen-quote" data-book="tommen-5"><span class="eyebrow">Releasing 10</span><blockquote>Siempre voy a volver por vos.</blockquote><div class="quote-bottom"><p class="quote-credit">Chloe Walsh</p><button class="save-quote" aria-pressed="false" aria-label="Guardar cita 34 como favorita">♡</button></div></article></div></div></section><p class="translation-note">Puede que alguna esté escrita un poco distinto en tu edición.</p></section><section id="recuerdos" class="memories"><div class="section-mascot" aria-hidden="true"><svg class="sigil heart-sigil" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="heart-beat" d="M60 98 20 60C-5 31 32 6 60 35c28-29 65-4 40 25Z" fill="currentColor" fill-opacity=".14"/><path class="heart-trace" d="M15 64h25l9-19 14 35 10-19h32"/></svg></div><span class="eyebrow">LAS COSAS NUESTRAS</span><h2>Entre nosotras.</h2><p>También quería dejarte algunas cosas que me hacen acordar a vos.</p><div class="notes"><article><small>EN EL GRUPO</small><h3>«Hear me out…»</h3><p>Arrancás con eso y ya sabemos que se viene algo. Te escuchamos. Después vemos si te damos la razón.</p></article><article><small>LO DE LAS COSAS DE ANIME</small><h3>«Quiero dárselos a alguien que sé que le gusta».</h3><p>Me acuerdo de que no querías tirarlas: querías dárselas a alguien que las fuera a disfrutar. Y cuando te quise pagar, no hubo caso, jajaja.</p></article><article><small>¿DÓNDE ESTÁN?</small><h3>Nos vemos en el Montse.</h3><p>Entre un «¿dónde están?» y otro, siempre terminamos encontrándonos por ahí. Y hablando de cualquier cosa.</p></article></div></section>
<section class="poetry"><div class="poetry-constellations" aria-hidden="true"><svg viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice"><g class="constellation-lines" fill="none" stroke="currentColor"><path d="M40 230 110 130 210 190 155 300 40 230M755 85 900 140 855 250 965 330M315 45 405 90 490 40"/></g><g fill="currentColor"><circle class="constellation-dot" cx="40" cy="230" r="5" style="--delay:0s"/><circle class="constellation-dot" cx="110" cy="130" r="3" style="--delay:0.3s"/><circle class="constellation-dot" cx="210" cy="190" r="5" style="--delay:0.6s"/><circle class="constellation-dot" cx="155" cy="300" r="3" style="--delay:0.8999999999999999s"/><circle class="constellation-dot" cx="755" cy="85" r="5" style="--delay:1.2s"/><circle class="constellation-dot" cx="900" cy="140" r="3" style="--delay:1.5s"/><circle class="constellation-dot" cx="855" cy="250" r="5" style="--delay:1.7999999999999998s"/><circle class="constellation-dot" cx="965" cy="330" r="3" style="--delay:2.1s"/><circle class="constellation-dot" cx="315" cy="45" r="5" style="--delay:2.4s"/><circle class="constellation-dot" cx="405" cy="90" r="3" style="--delay:2.6999999999999997s"/><circle class="constellation-dot" cx="490" cy="40" r="5" style="--delay:3s"/></g></svg></div><div class="poetry-emblem" aria-hidden="true"><svg class="sigil feather-sigil" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="quill"><path d="M30 84C21 62 36 30 92 12c6 28-6 61-48 72l-14 0Z" fill="currentColor" fill-opacity=".12"/><path d="M19 104Q43 68 83 27M34 82l-1-20M44 69l-2-22M55 56l-1-21M65 45l1-18M40 75l22-5M52 61l22-4M64 47l20-4"/></g><path class="ink-line" d="M42 103h43M57 110h28"/></svg></div><span class="eyebrow">ESTA NO PODÍA FALTAR</span><h2>Oh, capitana.<br><em>Mi capitana.</em></h2><p>No podía dejar afuera La sociedad de los poetas muertos. Así que imaginá que nos subimos al banco un ratito. Sin romper nada, por favor.</p><button id="desk" class="button">Subirme al banco ↗</button><p id="poem" aria-live="polite"></p></section>
<section id="carta"><div class="letter-mascots" aria-hidden="true"><svg class="sigil flower-sigil" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="flower-head"><path d="M60 46C17 12 13 66 44 66c-35 26 12 54 20 20 13 34 54 3 20-20 35-3 22-50-9-29-3-37-42-32-15 9Z" fill="currentColor" fill-opacity=".1"/><circle cx="64" cy="61" r="9"/></g><path d="M64 88v28M64 105q-22-20-32-13 6 19 32 19"/></svg><svg class="sigil key-sigil" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="key-body"><circle cx="43" cy="35" r="23"/><circle cx="43" cy="35" r="9"/><path d="m59 52 42 42-10 10-11-11-9 9-10-10 10-10-23-23"/></g></svg><svg class="sigil owl-sigil" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="owl-body"><path d="m27 33-5-20 25 11q13-6 26 0l25-11-5 20q17 54-33 72-50-18-33-72Z" fill="currentColor" fill-opacity=".1"/><circle cx="44" cy="50" r="16"/><circle cx="76" cy="50" r="16"/><g class="owl-eyes"><circle cx="44" cy="50" r="5" fill="currentColor"/><circle cx="76" cy="50" r="5" fill="currentColor"/></g><path d="m55 66 5 8 5-8M40 87l4 6M60 90v7M80 87l-4 6"/></g></svg></div><span class="eyebrow">ME QUEDABA DECIRTE ALGO</span><h2>Esto sí es para vos.</h2><p>Abrilo cuando quieras. No tenés que hacer ningún test antes.</p><div class="mail-scene"><span class="mail-spark spark-a" aria-hidden="true">✧</span><span class="mail-spark spark-b" aria-hidden="true">✧</span><button class="envelope" id="letter" aria-expanded="false" aria-controls="letterbody"><span class="envelope-sheet" aria-hidden="true"><span>Toty,</span><i></i><i></i><i></i><span>♡</span></span><span class="envelope-back" aria-hidden="true"></span><span class="envelope-pocket" aria-hidden="true"></span><span class="envelope-flap" aria-hidden="true"></span><span class="wax-seal" aria-hidden="true">t</span><span class="envelope-address">Para Toty</span><span class="envelope-action">Tocá para abrir</span></button></div><article id="letterbody" hidden><h3>Toty:</h3><p>Ya sé que no querías ninguna prueba rara ni nada parecido, jajaja. Espero que este código te guste y te saque una sonrisa. Y si no querés hacer los tests, los salteás y listo.</p><p>Aunque no nos escribamos mucho y casi siempre nos veamos en juntadas, cumples y cosas así, te quiero un montón. Quería hacerte algo lindo y desearte un muy feliz cumpleaños.</p><p>Ojalá pases re lindo hoy. Que haya gente que quieras, algo rico para comer y tiempo para hacer lo que se te cante. Y que sigamos juntándonos y teniendo cosas para contarnos.</p><p>Te quiero mucho, Toty. Feliz cumple 💚</p></article></section></main><footer>BUENO, AHORA ANDÁ A DISFRUTAR TU CUMPLE ♡ <span>✦</span></footer>
